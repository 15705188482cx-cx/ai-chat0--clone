<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 聊天分身</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:#F3F3F3;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 3px #222,0 0 0 6px #111,0 20px 60px rgba(0,0,0,.5);position:relative}
.tab-bar{display:flex;background:#FAFAFA;border-top:1px solid #E5E5E5;flex-shrink:0}
.tab{flex:1;text-align:center;padding:8px 0 6px;font-size:11px;color:#999;cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab.active{color:#07C160}.tab-icon{font-size:22px}.tab-label{font-size:10px}
.page{flex:1;overflow-y:auto;display:none;flex-direction:column}.page.active{display:flex}.page::-webkit-scrollbar{width:0}
.nav-bar{height:48px;background:#fff;display:flex;align-items:center;padding:0 12px;flex-shrink:0;border-bottom:1px solid #E5E5E5}
.nav-back,.nav-menu{color:#000;font-size:22px;padding:4px 8px;cursor:pointer;background:none;border:none}
.nav-title{flex:1;color:#000;font-size:17px;font-weight:600;text-align:center}
.chat-body{flex:1;overflow-y:auto;padding:10px 14px}.chat-body::-webkit-scrollbar{width:0}
.time-stamp{text-align:center;color:#B0B0B0;font-size:12px;margin:8px 0}
.msg-row{display:flex;align-items:flex-start;padding:8px 0}.msg-row.me{flex-direction:row-reverse}
.msg-body{max-width:70%;margin:0 9px}
.bubble{padding:9px 12px;font-size:16px;line-height:22px;color:#3C4146;word-break:break-word}
.bubble.me{background:#95EC69;border-radius:16px 16px 4px 16px}
.bubble.her{background:#fff;border-radius:16px 16px 16px 4px;border:1px solid #E4E4E4}
.avt-wrap{flex-shrink:0}.avt{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;overflow:hidden}
.avt.her{background:#FF9EAF}.avt.me{background:#4A90D9}
.thinking{display:none;align-items:flex-start;padding:8px 0}.thinking.show{display:flex}
.dots-bubble{background:#fff;border-radius:16px 16px 16px 4px;border:1px solid #E4E4E4;padding:12px 14px;display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:#B0B0B0;animation:bounce .9s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
.emoji-panel{display:none;background:#F8F8F8;border-top:1px solid #E5E5E5;max-height:200px;overflow-y:auto}
.emoji-panel.show{display:block}.emoji-panel::-webkit-scrollbar{width:0}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px 8px}
.emoji-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border-radius:6px}
.emoji-cell:hover{background:#E5E5E5}.emoji-cell:active{background:#D5D5D5}
.emoji-bar{display:flex;justify-content:flex-end;align-items:center;padding:8px 12px;gap:12px;border-top:1px solid #E5E5E5}
.emoji-send{background:#07C160;color:#fff;padding:8px 20px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.func-panel{display:none;flex-direction:row;background:#F8F8F8;padding:20px;border-top:1px solid #E5E5E5;gap:24px}.func-panel.show{display:flex}
.func-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.func-icon-w{width:60px;height:60px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.func-label{font-size:12px;color:#666}
.input-bar{display:flex;align-items:flex-end;background:#F8F8F8;padding:8px;border-top:1px solid #E5E5E5;gap:4px;flex-shrink:0}
.tool-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border-radius:4px;border:none;background:none;line-height:1}
.tool-btn:active{background:#E5E5E5}
.input-box{flex:1;background:#fff;border-radius:5px;border:1px solid #F4F4F4;padding:9px 12px;font-size:16px;outline:none;max-height:100px;font-family:inherit;resize:none;color:#3C4146}
.send-btn{display:none;background:#07C160;color:#fff;font-size:15px;font-weight:600;padding:9px 14px;border-radius:4px;cursor:pointer;border:none}.send-btn.show{display:block}
.plus-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;color:#666;cursor:pointer;border-radius:4px;border:none;background:none;line-height:1}.plus-btn:active{background:#E5E5E5}
.record-btn{display:none;flex:1;background:#fff;border-radius:5px;height:38px;align-items:center;justify-content:center;border:1px solid #F4F4F4;cursor:pointer;user-select:none;font-size:15px;color:#333}.record-btn.show{display:flex}
.overlay{display:none;position:absolute;inset:0;background:#F3F3F3;z-index:200;flex-direction:column}.overlay.show{display:flex}.overlay::-webkit-scrollbar{width:0}
/* Cover */
.cover-overlay{position:absolute;inset:0;z-index:300;display:flex;transition:opacity .4s}
.cover-bg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:linear-gradient(175deg,#FEF9F3,#FDF5F0,#FCF3F5,#F8F4F0,#FEF9F3);padding:70px 28px 44px;position:relative;overflow:hidden}
.cover-sig{text-align:center;z-index:1;color:rgba(140,120,110,.65);font-size:14px;font-style:italic;letter-spacing:1.5px}
.cover-logo-w{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 2px 16px rgba(180,160,150,.1)}
.cover-logo-svg{font-size:38px;opacity:.85}
.cover-title{font-size:22px;font-weight:600;color:#8B7E74;letter-spacing:3px;margin-bottom:6px}
.cover-sub{font-size:12px;color:rgba(160,145,135,.55);letter-spacing:2px}
.cover-bottom{display:flex;flex-direction:column;align-items:center;gap:14px;z-index:1;width:100%}
.cover-music{background:rgba(255,255,255,.6);border:1px solid rgba(180,160,150,.15);color:rgba(150,135,125,.55);font-size:12px;padding:9px 22px;border-radius:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.cover-music.playing{background:rgba(255,158,175,.1);border-color:rgba(255,158,175,.3);color:#D4959F}
.cover-enter{background:rgba(7,193,96,.08);border:1px solid rgba(7,193,96,.2);color:#07C160;font-size:16px;font-weight:500;padding:14px 0;border-radius:28px;cursor:pointer;font-family:inherit;width:100%;letter-spacing:3px}
.cover-enter:active{background:rgba(7,193,96,.2)}
/* Home */
.home-scroll{flex:1;overflow-y:auto;padding-bottom:20px}.home-scroll::-webkit-scrollbar{width:0}
.home-header{text-align:center;padding:40px 20px 24px}
.home-logo{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#FF9EAF,#FFB3C1);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 2px 12px rgba(255,158,175,.25)}
.home-name{font-size:24px;font-weight:800;color:#191919;margin-bottom:4px}
.home-tag{font-size:14px;color:#999}
.card{background:#fff;margin:0 20px 16px;border-radius:12px;padding:16px}
.card-title{font-size:13px;color:#888;margin-bottom:8px}
.stat-r{display:flex;align-items:center;padding:8px 0}.stat-i{font-size:18px;margin-right:10px}.stat-l{flex:1;font-size:15px;color:#666}.stat-v{font-size:15px;font-weight:600;color:#191919}.stat-s{height:1px;background:#EEE;margin:4px 0 4px 28px}
.act-btn{display:flex;align-items:center;background:#fff;padding:16px;border-radius:12px;margin:0 20px 10px;cursor:pointer;border:none;width:calc(100% - 40px);font-family:inherit}.act-btn:active{background:#f5f5f5}
.act-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:12px;font-size:22px;flex-shrink:0}
.act-info{flex:1}.act-label{font-size:16px;font-weight:500;color:#191919}.act-hint{font-size:12px;color:#999}.act-arrow{font-size:18px;color:#CCC;margin-left:8px}
/* List */
.list-header{font-size:28px;font-weight:700;color:#191919;padding:16px 20px 12px}
.list-body{flex:1;overflow-y:auto;position:relative}.list-body::-webkit-scrollbar{width:0}
.conv-item{display:flex;align-items:center;padding:14px 16px;background:#fff;cursor:pointer;border:none;width:100%;font-family:inherit}.conv-item:active{background:#f5f5f5}
.conv-avt{width:48px;height:48px;border-radius:50%;background:#07C160;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:600;flex-shrink:0}
.conv-center{flex:1;margin:0 12px;min-width:0}.conv-name{font-size:16px;font-weight:500;color:#191919;margin-bottom:4px}
.conv-preview{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-right{text-align:right;flex-shrink:0}.conv-time{font-size:12px;color:#B0B0B0}
.conv-sep{height:1px;background:#E5E5E5;margin-left:76px}
.fab{position:absolute;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:#07C160;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:10;border:none}.fab:active{background:#06AD56}
/* Settings */
.settings-scroll{flex:1;overflow-y:auto;padding-bottom:40px}.settings-scroll::-webkit-scrollbar{width:0}
.sec-h{font-size:13px;color:#888;margin:20px 20px 8px}
.sec-card{background:#fff;border-top:1px solid #E5E5E5;border-bottom:1px solid #E5E5E5}
.sec-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;min-height:48px;cursor:pointer;border:none;width:100%;background:none;font-family:inherit;text-align:left}.sec-row:active{background:#f5f5f5}
.sec-row .l{font-size:16px;color:#191919;flex-shrink:0}.sec-row .v{font-size:15px;color:#999;display:flex;align-items:center;gap:6px;text-align:right;flex-shrink:0}.sec-row .arr{color:#ccc;font-size:15px;margin-left:2px}
.sec-avt{width:56px;height:56px;border-radius:4px;background:#E0E0E0;display:flex;align-items:center;justify-content:center;font-size:28px}
.her-avt{width:40px;height:40px;border-radius:50%;background:#FF9EAF;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:600}
.ks{font-size:13px;color:#07C160;font-weight:500}
/* Toast */
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:15px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center;max-width:80%}.toast.show{opacity:1}
/* Sheet */
.sheet-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:250;justify-content:flex-end}.sheet-overlay.show{display:flex}
.sheet{background:#fff;border-radius:14px;overflow:hidden;margin:0 8px}
.sheet-opt{text-align:center;padding:18px;font-size:16px;color:#333;cursor:pointer;border-bottom:1px solid #F0F0F0}.sheet-opt:active{background:#f0f0f0}
.sheet-cancel{text-align:center;padding:16px;font-size:16px;font-weight:600;color:#333;cursor:pointer;background:#fff;margin-top:8px;border-radius:14px}
/* Persona manage */
.pcard{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.pcard-header{display:flex;align-items:center;margin-bottom:12px}
.pcard-avt{width:56px;height:56px;border-radius:50%;background:#FF9EAF;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;margin-right:14px}
.pcard-info{flex:1}.pcard-name{font-size:18px;font-weight:600;color:#191919}.pcard-src{font-size:13px;color:#888}.pcard-date{font-size:12px;color:#BBB}
.pcard-btn-add{display:flex;align-items:center;padding:10px;margin-top:8px;background:#F9FDF9;border-radius:8px;border:1px solid #E0F0E0;cursor:pointer;font-family:inherit;width:100%;text-align:left}
.pcard-actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #F0F0F0}
.pcard-btn-chat{flex:1;background:#07C160;color:#fff;border:none;border-radius:8px;padding:10px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.pcard-btn-del{background:#fff;color:#E74C3C;border:1px solid #FCC;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit}
/* Misc */
.btn-green{background:#07C160;color:#fff;font-size:16px;font-weight:600;padding:14px 40px;border-radius:10px;cursor:pointer;border:none;font-family:inherit;width:100%}.btn-green:active{background:#06AD56}
.btn-green-sm{background:#FF9EAF;color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:16px;cursor:pointer;border:none;font-family:inherit;white-space:nowrap}
.btn-outline{border:1px solid #FFB3C1;color:#FF9EAF;font-size:13px;font-weight:600;padding:8px 18px;border-radius:16px;background:transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.version{text-align:center;color:#ccc;font-size:12px;margin-top:28px}
.disclaimer{font-size:13px;color:#999;line-height:20px;padding:14px 20px}
.data-src{font-size:10px;color:#CCC;display:block;text-align:right}
@media(max-width:420px){.phone{width:100vw;height:100vh;border-radius:0}}

/* ===== 导入向导 ===== */
.wiz-steps-bar{display:flex;align-items:flex-start;justify-content:center;padding:24px 20px 12px;background:#fff;gap:0}
.wiz-step-item{display:flex;flex-direction:column;align-items:center}
.wiz-step-dot{width:30px;height:30px;border-radius:15px;border:2px solid #E8DEDE;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#CCC;background:#fff;transition:all .3s}
.wiz-step-dot.on{border-color:#FF9EAF;background:#FF9EAF;color:#fff;box-shadow:0 2px 8px rgba(255,158,175,.2)}
.wiz-step-dot.done{border-color:#FFB3C1;background:#FFB3C1;color:#fff}
.wiz-step-label{font-size:10px;color:#BBB;margin-top:4px}.wiz-step-label.on{color:#FF9EAF;font-weight:600}
.wiz-step-line{width:40px;height:2px;background:#F0EBEB;margin:0 6px;align-self:center;margin-bottom:18px;border-radius:1px;transition:all .3s}
.wiz-step-line.done{background:#FFD4DB}
.wiz-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:24px 20px}
.wiz-body::-webkit-scrollbar{width:0}
/* Step 1: file select */
.wiz-file-drop{border:2px dashed #E8DEDE;border-radius:16px;padding:48px 24px;text-align:center;background:rgba(255,255,255,.5);cursor:pointer;transition:all .3s;margin:auto 0}
.wiz-file-drop:hover{border-color:#FFB3C1;background:rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(255,158,175,.08)}
.wiz-file-icon{font-size:48px;margin-bottom:12px;display:block}
.wiz-file-title{font-size:17px;font-weight:600;color:#666;margin-bottom:6px}
.wiz-file-hint{font-size:12px;color:#AAA;line-height:1.7}
/* Step 2: parsing */
.wiz-parsing-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.wiz-spin{width:52px;height:52px;border-radius:50%;border:3px solid #FDE4E8;border-top-color:#FF9EAF;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wiz-parsing-title{font-size:17px;font-weight:600;color:#666}
.wiz-parsing-file{font-size:13px;color:#AAA}
.wiz-prog-bar{width:200px;height:4px;background:#F0EBEB;border-radius:2px;overflow:hidden}
.wiz-prog-fill{height:100%;background:linear-gradient(90deg,#FFB3C1,#FF9EAF);border-radius:2px;transition:width .3s}
.wiz-prog-text{font-size:13px;color:#FF9EAF;font-weight:500}
/* Step 3: result */
.wiz-result-wrap{text-align:center}
.wiz-check{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#E8F8EF,#F0FDF4);display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px}
.wiz-result-title{font-size:20px;font-weight:700;color:#555;margin-bottom:18px}
.wiz-summary{background:#fff;border-radius:14px;padding:16px 20px;text-align:left;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.wiz-summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F8F4F4;font-size:14px}.wiz-summary-row:last-child{border:0}
.wiz-summary-l{color:#999}.wiz-summary-v{font-weight:600;color:#555}
.wiz-match-card{background:#fff;border-radius:14px;padding:16px 20px;text-align:left;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.wiz-match-title{font-size:15px;font-weight:600;color:#666;margin-bottom:2px}
.wiz-match-hint{font-size:12px;color:#BBB;margin-bottom:14px}
.wiz-match-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #F8F4F4}
.wiz-match-info{display:flex;align-items:center;gap:10px;flex:1}
.wiz-match-avt{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;flex-shrink:0}
.wiz-match-avt.matched{background:#FFB3C1}.wiz-match-avt.unmatched{background:#C8D6E5}
.wiz-match-name{font-size:14px;font-weight:500;color:#555}
.wiz-match-status{font-size:11px;margin-top:2px}
.wiz-match-status.matched{color:#FF9EAF}.wiz-match-status.unmatched{color:#C8D6E5}
.wiz-btn-add{background:#FF9EAF;color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:16px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.wiz-btn-add:active{background:#FF8598}
.wiz-btn-new{border:1px solid #FFB3C1;color:#FF9EAF;font-size:13px;font-weight:600;padding:8px 18px;border-radius:16px;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
.wiz-btn-new:active{background:#FFF5F6}
.wiz-skip-link{display:block;padding:10px;color:#BBB;font-size:13px;text-align:center;cursor:pointer;background:none;border:none;font-family:inherit;margin:12px auto 0}
.wiz-retry-link{display:block;padding:8px;color:#FF9EAF;font-size:13px;text-align:center;cursor:pointer;background:none;border:none;font-family:inherit;margin:0 auto}
</style>
</head>
<body>
<div class="phone">
<div class="toast" id="toast"></div>

</div>

<div class="home-name">AI 聊天分身</div>

<div class="func-panel" id="chatFuncPanel">

<button class="tool-btn" onclick="toggleChatEmoji()">😊</button>
<button class="send-btn" id="chatSendBtn" onclick="chatSend()">发送</button>
